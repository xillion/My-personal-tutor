# CI (T-001.4): `just check` на Linux, Windows и macOS для каждого PR и push в main и task/*.
# Actions зафиксированы полным SHA коммита (комментарий — версия тега); обновлять отдельным PR.
name: CI

on:
  push:
    # До MVP задачи идут через ветки task/* без PR (слияние fast-forward в main).
    branches: [main, 'task/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Запуски на main не отменяются: статус и кэш должны относиться к каждому коммиту main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: just check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Системные зависимости Tauri 2: https://v2.tauri.app/start/prerequisites/#linux
      # libspeechd-dev + libclang-dev: крейт `tts` (feature `spikes`, T-004.1) линкует
      # libspeechd, а speech-dispatcher-sys генерирует привязки через bindgen (libclang).
      # На Windows (WinRT) и macOS (AVFoundation) `tts` системных пакетов не требует.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libspeechd-dev \
            libclang-dev

      # Версия должна совпадать с rust-toolchain.toml (ADR-23); rustup затем читает этот файл.
      - name: Install Rust 1.100.0
        uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Кэш сохраняют только сборки main, PR его читают: экономия квоты кэша.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install just and cargo-deny
        uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: just@1.59.0,cargo-deny@0.22.1
          # Только готовые бинарники с проверкой контрольной суммы, без сборки из исходников.
          fallback: none

      # pnpm — версия из `packageManager` в package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile

      - name: just check
        run: just check

      - name: Working tree is clean after checks
        shell: bash
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      # Debug-сборка со спайк-командами для ручного прогона на Windows 10/11 (T-004.3):
      # без установщика, CSP действует (в отличие от `tauri dev`). Артефакт — по SHA коммита.
      - name: Build Windows spike binary (debug, feature spikes)
        if: runner.os == 'Windows'
        run: just build-spikes

      - name: Upload Windows spike binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mpt-spikes-windows-debug-${{ github.sha }}
          path: target/debug/my-personal-tutor.exe
          if-no-files-found: error
          retention-days: 14

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      # SHA-256 из actionlint_1.7.12_checksums.txt релиза.
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint

      - name: Run actionlint
        run: '"$RUNNER_TEMP/actionlint" -color'
