[workspace]
members = ["crates/*", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-or-later"
repository = "https://github.com/xillion/My-personal-tutor"
publish = false

[workspace.dependencies]
# Внутренние крейты. Направление зависимостей — docs/01_ARCHITECTURE.md §2.
mpt-core = { path = "crates/mpt-core" }
mpt-storage = { path = "crates/mpt-storage" }
mpt-importer = { path = "crates/mpt-importer" }
mpt-services = { path = "crates/mpt-services" }

# Внешние. Tauri — только 2.x (ADR-23); точные версии — в Cargo.lock.
tauri = "2.12"
tauri-build = "2.7"
# IPC-контракт Rust ↔ TS (ADR-10, ADR-23): RC-версии фиксируются точно.
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "=0.0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
